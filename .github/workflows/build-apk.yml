name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node 20 ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. JDK 17 (required by Android Gradle Plugin 8.x) ───────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Use the Android SDK already on ubuntu-latest ─────────────────────
      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # ── 5. Accept SDK licenses (needed for Gradle) ──────────────────────────
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # ── 6. Install required SDK components ──────────────────────────────────
      - name: Install SDK platform and build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # ── 7. Install web dependencies ──────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 8. Build the Vite web app ────────────────────────────────────────────
      - name: Build web app (Vite)
        run: npm run build

      # ── 9. Install Capacitor packages ────────────────────────────────────────
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # ── 10. Add Android platform ─────────────────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      # ── 11. Sync web assets into Android project ─────────────────────────────
      - name: Sync Capacitor assets
        run: npx cap sync android

      # ── 12. Patch AndroidManifest.xml permissions ────────────────────────────
      - name: Add Android permissions to manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application|' "$MANIFEST"
          echo "Manifest permissions added"
          grep "VIBRATE\|BLUETOOTH\|LOCATION" "$MANIFEST"

      # ── 13. Gradle build ─────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 14. Collect APK ──────────────────────────────────────────────────────
      - name: Collect and checksum APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-apk/SamarthWatch-1.0.0-debug.apk
          sha256sum release-apk/SamarthWatch-1.0.0-debug.apk > release-apk/checksums.txt
          ls -lh release-apk/

      # ── 15. Upload artifact ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamarthWatch-1.0.0-debug
          path: release-apk/
          retention-days: 30
