name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node 20 ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. JDK 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Locate Android SDK and accept licenses ────────────────────────────
      - name: Set up Android SDK paths and licenses
        run: |
          # ANDROID_SDK_ROOT is pre-set on ubuntu-latest runners
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Find sdkmanager (could be in two locations depending on runner image)
          SDK_MGR=""
          if [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDK_MGR="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi

          if [ -n "$SDK_MGR" ]; then
            echo "Found sdkmanager at: $SDK_MGR"
            yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
            "$SDK_MGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not found in expected locations; listing SDK root:"
            ls "$ANDROID_SDK_ROOT" || true
          fi

      # ── 5. Install npm dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Build the Vite web app ────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 7. Install Capacitor ─────────────────────────────────────────────────
      - name: Install Capacitor packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap --version

      # ── 8. Add Android platform ──────────────────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      # ── 9. Sync web assets ───────────────────────────────────────────────────
      - name: Sync Capacitor assets to Android
        run: npx cap sync android

      # ── 10. Add permissions to AndroidManifest ───────────────────────────────
      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          cat "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application|' "$MANIFEST"
          echo "--- Patched manifest (permissions section) ---"
          grep -A2 "VIBRATE\|BLUETOOTH\|LOCATION\|RECORD" "$MANIFEST" | head -20

      # ── 11. Gradle: build debug APK ──────────────────────────────────────────
      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -60
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 12. Collect APK ──────────────────────────────────────────────────────
      - name: Copy and checksum APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-apk/SamarthWatch-1.0.0-debug.apk
          sha256sum release-apk/SamarthWatch-1.0.0-debug.apk > release-apk/checksums.txt
          echo "=== APK ready ==="
          ls -lh release-apk/

      # ── 13. Upload artifact ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamarthWatch-1.0.0-debug
          path: release-apk/
          retention-days: 30
