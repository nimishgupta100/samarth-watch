name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node 20 with npm cache ────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. JDK 17 (Temurin) — required by Android Gradle Plugin 8.x ────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install web dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Build the Vite web app ────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 7. Add Capacitor packages ────────────────────────────────────────────
      - name: Install Capacitor packages
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      # ── 8. Add Android platform (idempotent — skips if android/ already exists)
      - name: Add Android platform
        run: npx cap add android || true

      # ── 9. Sync web assets into Android project ──────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 10. Patch AndroidManifest.xml permissions ────────────────────────────
      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Insert permissions before <application tag
          sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application|' "$MANIFEST"
          echo "AndroidManifest patched"

      # ── 11. Gradle build ─────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 12. Rename APK ───────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release-apk/SamarthWatch-1.0.0-debug.apk
          sha256sum release-apk/SamarthWatch-1.0.0-debug.apk > release-apk/checksums.txt
          echo "APK info:"
          ls -lh release-apk/

      # ── 13. Upload artifact ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamarthWatch-1.0.0-debug
          path: release-apk/
          retention-days: 30
